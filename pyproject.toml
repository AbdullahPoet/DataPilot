[project]
name = "datapilot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13",
    "bokeh>=3.7",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "openpyxl>=3.1",
    "pandas>=2.2,<4",
    "plotly>=6.0",
    "reportlab>=4.3",
    "seaborn>=0.13",
    "sqlglot>=27,<31",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "streamlit[pdf]>=1.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilot"]

[tool.hatch.build.targets.sdist]
include = ["src/datapilot", "skills", "tests", "docs", "app.py", "streamlit_app.py", "README.md", "pyproject.toml", "uv.lock"]
exclude = ["AGENTS.md", "**/AGENTS.md", "**/__pycache__", "**/*.pyc"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11", "pypdf>=5", "jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
